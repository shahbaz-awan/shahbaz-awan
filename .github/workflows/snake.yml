name: generate animated snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: generate snake grid
        uses: Platane/snk@v3
        id: snake-grid
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300F6FF&color_dots=%23161b22,%230ABDC6,%2300F6FF,%2300F6FF,%2300F6FF
            dist/github-contribution-grid-snake.gif?color_snake=%2300F6FF&color_dots=%23161b22,%230ABDC6,%2300F6FF,%2300F6FF,%2300F6FF

      - name: push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
